services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jouri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jouri_password}
      POSTGRES_DB: ${POSTGRES_DB:-jouri}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jouri} -d ${POSTGRES_DB:-jouri}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  vision-search:
    build:
      context: ./vision-search
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VISION_MODEL=${VISION_MODEL:-Marqo/marqo-fashionSigLIP}
      - MAX_IMAGES_PER_PRODUCT=${MAX_IMAGES_PER_PRODUCT:-3}
    volumes:
      - /home/ubuntu/jouri/products_photo:/products_photo:ro
      - vision_model_cache:/models

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
      vision-search:
        condition: service_started
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://jouri:jouri_password@db:5432/jouri}
      - JWT_SECRET=${JWT_SECRET:-jouri_super_secret_key}
      - OLLAMA_URL=http://ollama:11434/v1
      - VISION_SEARCH_URL=http://vision-search:8090
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1.5}
      - OPENAI_IMAGE_SIZE=${OPENAI_IMAGE_SIZE:-1024x1024}
      - OPENAI_IMAGE_QUALITY=${OPENAI_IMAGE_QUALITY:-medium}
      - SHOPIFY_STORE_URL=${SHOPIFY_STORE_URL:-}
      - SHOPIFY_SHOP_URL=${SHOPIFY_SHOP_URL:-}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN:-}
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID:-}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET:-}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-}
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET:-}
      - SHOPIFY_VENDOR=Binbon Kids
      - PRODUCTS_BASE=/products_photo
      - BACKUP_TIMEZONE=Europe/Istanbul
      - TOTP_SECRET=${TOTP_SECRET:-}
      - USER_PASSWORD=${USER_PASSWORD:-}
      - USER_PASSWORD_2=${USER_PASSWORD_2:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - EDIT_LOCK_CODE=${EDIT_LOCK_CODE:-}
    volumes:
      - /home/ubuntu/jouri/products_photo:/products_photo
      - /home/ubuntu/jouri/backups:/backups
      - /home/ubuntu/.config/rclone:/root/.config/rclone

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  ollama_data:
  vision_model_cache:
