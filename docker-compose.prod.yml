services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jouri
      POSTGRES_PASSWORD: jouri_password
      POSTGRES_DB: jouri
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jouri -d jouri"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://jouri:jouri_password@db:5432/jouri
      - JWT_SECRET=jouri_super_secret_key
      - OLLAMA_URL=http://ollama:11434/v1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SHOPIFY_STORE_URL=${SHOPIFY_STORE_URL:-}
      - SHOPIFY_SHOP_URL=${SHOPIFY_SHOP_URL:-}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN:-}
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID:-}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET:-}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-}
      - SHOPIFY_VENDOR=Binbon Kids
      - PRODUCTS_BASE=/products_photo
    volumes:
      - /home/ubuntu/jouri/products_photo:/products_photo
      - /home/ubuntu/jouri/backups:/backups
      - /home/ubuntu/.config/rclone:/root/.config/rclone

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  ollama_data:
