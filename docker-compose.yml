services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jouri}
      POSTGRES_USER: ${POSTGRES_USER:-jouri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jouri123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jouri} -d ${POSTGRES_DB:-jouri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api:/app
      - ../products_photo:/products_photo
      - ../backups:/backups
      - /home/ubuntu/.config/rclone-docker:/root/.config/rclone
    env_file: .env
    environment:
      PRODUCTS_BASE: /products_photo
      OLLAMA_URL: http://ollama:11434/v1/
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b-it-qat}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file: .env
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
